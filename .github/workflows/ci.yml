name: Evaluation export checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  metrics-export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
